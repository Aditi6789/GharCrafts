spring.application.name=GharCraft
server.port=8080

# MySQL configuration (create the database first; see README.md)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gharcraft?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

# To run without MySQL for a quick local demo, use:
# mvn spring-boot:run -Dspring-boot.run.profiles=demo